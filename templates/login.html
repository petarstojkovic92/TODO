{% extends 'base.html' %}

{% block body %}
<div class="container-fluid d-flex justify-content-center align-items-center flex-grow-1 py-4" data-bs-theme="dark">
    <form method="POST" style="width: 28rem;" class="p-4 border rounded bg-body-tertiary shadow">
        <h2 class="text-center mb-4">Login</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addon1">Username</span>
            <input type="text" name="username" class="form-control" placeholder="Enter Username" aria-label="Username" aria-describedby="basic-addon1" required>
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text" id="password1">Password</span>
            <input type="password" name="password" class="form-control" placeholder="Enter Password" aria-describedby="password1" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Login</button>
        <div class="text-center mt-3">
            <small class="text-muted">Don't have an account? <a href="{{ url_for('register') }}">Register</a></small>
        </div>
    </form>
</div>
{% endblock %}
