{% extends 'base.html' %}

{% block body %}
<div class="container-fluid px-4 mt-3" data-bs-theme="dark">
    <form method="POST" class="w-100">
        <div class="input-group mb-3">
            <button class="btn btn-outline-secondary" type="submit" id="button-addon1">Create the list</button>
            <input name="title" type="text" class="form-control" placeholder="Enter your task here *" aria-label="Example text with button addon" aria-describedby="button-addon1" required>
        </div>
    </form>

    <h5 class="mb-3">Tasks</h5>

    {% for task in tasks %}
    <div class="card bg-dark text-light border-1 rounded-3 p-2 mb-2">
      <div class="card-body d-flex align-items-center justify-content-between py-1 px-2">

        {% if edit_id == task.id %}
        <form action="{{ url_for('update', task_id=task.id) }}" method="POST" class="d-flex align-items-center justify-content-between w-100">
          <div class="d-flex align-items-center gap-3 flex-grow-1 me-3">
            <input class="form-check-input bg-transparent border-secondary fs-5 mt-0"
                   type="checkbox"
                   id="taskCheck-{{ task.id }}"
                   {% if task.completed %}checked{% endif %}>

            <input type="text"
                   name="title"
                   class="form-control form-control-sm bg-dark text-light border-secondary"
                   value="{{ task.title }}"
                   autofocus
                   required>
          </div>

          <div class="d-flex align-items-center gap-2">
            <button type="submit" class="btn btn-sm btn-outline-success border-0">
              <i class="bi bi-check-lg fs-5"></i>
            </button>
            <a href="{{ url_for('show_tasks') }}" class="btn btn-sm btn-outline-secondary border-0 text-white">
              <i class="bi bi-x-lg fs-5"></i>
            </a>
          </div>
        </form>

        {% else %}
        <form action="{{ url_for('update', task_id=task.id) }}" method="POST" class="d-flex align-items-center justify-content-between w-100">
          <div class="d-flex align-items-center gap-3">
            <input class="form-check-input bg-transparent border-secondary fs-5 mt-0"
                   type="checkbox"
                   id="taskCheck-{{ task.id }}"
                   {% if task.completed %}checked{% endif %}>

            <input type="hidden" name="title" value="{{ task.title }}">

            <span class="fw-normal">{{ task.title }}</span>

            <div class="form-field">
                <input type="date"
                       class="form-control form-control-sm bg-dark text-light border-secondary"
                       name="due_date"
                       value="{{ task.due_date }}"
                       onchange="this.form.submit()"
                       autocomplete="off">
            </div>
          </div>

          <div class="d-flex align-items-center gap-3 text-white">
              <a href="#" class="text-white text-decoration-none">
                <i class="bi bi-star-fill fs-5"></i>
              </a>
              <a href="{{ url_for('update', task_id=task.id) }}" class="text-white text-decoration-none">
                <i class="bi bi-pen-fill"></i>
              </a>
              <a href="{{ url_for('delete', task_id=task.id) }}" class="text-white text-decoration-none">
                <i class="bi bi-trash-fill fs-5"></i>
              </a>
          </div>
        </form>
        {% endif %}

      </div>
    </div>
    {% else %}
    <p class="text-muted">No tasks found.</p>
    {% endfor %}
</div>
{% endblock %}
